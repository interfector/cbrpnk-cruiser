[package]
name = "cbrpnk-cruiser"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "A cyberpunk filesystem cruiser and shell launcher"
default-run = "cbrpnk-cruiser"

[lib]
name = "cbrpnk_cruiser"
path = "src/lib.rs"

[[bin]]
name = "cbrpnk-cruiser"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
env_logger = "0.11"
log = "0.4"
macroquad = "0.4.16"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
